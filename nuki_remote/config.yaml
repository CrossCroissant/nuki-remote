name: Nuki Remote
version: "1.1.0"
slug: nuki_remote
description: Eigenständige Webseite zur geschützten Fernsteuerung der Nuki-Haustür (PIN-Sitzung + zentrale Freigabe)
url: https://github.com/CrossCroissant/nuki-remote
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - type: ssl
ports:
  8099/tcp: 8443
ports_description:
  8099/tcp: Nuki-Webseite (am Router freigeben)
options:
  pin: "1337"
  sitzung_minuten: 15
  max_fehlversuche: 5
  sperre_minuten: 15
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  pin: password
  sitzung_minuten: int(1,120)
  max_fehlversuche: int(1,20)
  sperre_minuten: int(1,1440)
  ssl: bool
  certfile: str
  keyfile: str
